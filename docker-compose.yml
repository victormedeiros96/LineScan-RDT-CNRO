services:
  redis:
    image: redis:7-alpine
    container_name: rdt01-redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: rdt01-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rdt01}
      POSTGRES_USER: ${POSTGRES_USER:-rdt01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdt01-backend
    ports:
      - "8000:8000"
    volumes:
      - ./modelos:/app/modelos:ro
      - ./dados:/app/dados
      - ./sources.json:/app/config/sources.json:ro
    environment:
      - MODELOS_DIR=/app/modelos
      - DADOS_DIR=/app/dados
      - SOURCES_CONFIG=/app/config/sources.json
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rdt01}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-rdt01}
      - DEBUG=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rdt01-worker
    command: rq worker --url redis://redis:6379/0 rdt01-processing
    volumes:
      - ./modelos:/app/modelos:ro
      - ./dados:/app/dados
      - ./sources.json:/app/config/sources.json:ro
    environment:
      - MODELOS_DIR=/app/modelos
      - DADOS_DIR=/app/dados
      - SOURCES_CONFIG=/app/config/sources.json
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rdt01}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-rdt01}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rdt01-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
